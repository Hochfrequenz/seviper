[project]
name = "seviper"
description = "A simple and easy to use library to catch and handle exceptions."
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Leon Haffmans", email = "leon.haffmans@hochfrequenz.de" }]
keywords = ["error-handling", "aiostream"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []     # add all the dependencies here
dynamic = ["readme", "version"]

[project.optional-dependencies]
aiostream = [
    "aiostream"
    # seviper[aiostream] is an optional dependency which is not required for the bare seviper logic to work.
    # It is intended for the users of seviper (like `seviper[aiostream]` which we mention in our README).
    # It is NOT pinned because seviper works with any recent version of aiostream and we don't want to restrict the users of the library.
    # Our (internal) CI/CD tooling dependencies (coverage, formatting etc.) live in [dependency-groups] instead, because they are not intended for external use
    # but give us a stable and reproducable CI and dev experience.
]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/seviper/releases"
Homepage = "https://github.com/Hochfrequenz/seviper"

[dependency-groups]
tests = [
    "aiostream",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
coverage = [
    "coverage==7.15.2",
    { include-group = "tests" },
]
formatting = [
    "black==26.5.1",
    "isort==8.0.1",
]
linting = [
    "pylint==4.0.6",
    { include-group = "tests" },
]
spell_check = [
    "codespell==2.4.3",
]
type_check = [
    "mypy==2.3.0",
    { include-group = "tests" },
]
dev = [
    { include-group = "tests" },
    { include-group = "coverage" },
    { include-group = "formatting" },
    { include-group = "linting" },
    { include-group = "spell_check" },
    { include-group = "type_check" },
    "pre-commit",
]

[tool.uv]
default-groups = []

[tool.black]
line-length = 120
target_version = ["py312", "py313"]

[tool.isort]
line_length = 120
profile = "black"

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 120

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_error_handler_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
