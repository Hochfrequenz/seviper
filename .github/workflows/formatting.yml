name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  black:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]
        tool: ["black", "isort"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run --group formatting ${{ matrix.tool }} . --check
