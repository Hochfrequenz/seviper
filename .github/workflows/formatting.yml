name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  ruff-format:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ruff Format Check
        run: |
          uv run --group linting ruff format . --check
